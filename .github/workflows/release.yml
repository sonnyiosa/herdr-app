# A release of the app: push a tag `v<version>` matching Cargo.toml.
# Build and pack the macOS app (scripts/package; no core inside). Upload to the
# releases bucket, versioned files first and app/latest.json last, so nobody
# sees a version whose files aren't there yet.
#
# Caches: a tag's own cache is visible only to that tag, so tags restore
# master's. Master keeps them warm by building (without publishing) when
# what the build depends on changes: Cargo.lock, the vendored crates, the
# toolchain, this workflow. Let that run finish before tagging.
#
# The cache is the whole target/, with scripts/ci-sources keeping unchanged
# files fresh to Cargo: the vendored crates (gpui-kit, taffy, ghostty) are
# the slow part, and a fresh checkout would otherwise rebuild them all.
#
# Tests (the native screenshot test too) run only in ci.yml: a tag publishes
# once ci.yml has passed for its commit.
name: build and release
# Master pushes only build (to keep the cache warm); tags publish.
run-name: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('build {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - vendor/**
      - crates/**
      - scripts/package
      - scripts/notices.*
      - tests/notices.rs
      - about.toml
      - licenses/**
      - LICENSE
      - THIRD-PARTY-NOTICES
      - scripts/mac-sign
      - scripts/macos-entitlements.plist
      - scripts/mac-dmg
      - distribution/macos/dmg/**
      - scripts/ci-sources
      - .github/workflows/release.yml
  # Builds only; publishing needs a tag.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled master build saves no cache, a cancelled tag no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0
  IS_TAG: ${{ github.ref_type == 'tag' }}

jobs:
  build:
    runs-on: macos-15
    environment: ${{ github.ref_type == 'tag' && 'release' || 'build' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-v2-macos-aarch64-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-v2-macos-aarch64-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            release-v2-macos-aarch64-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build and pack
        env:
          RELEASES_URL: ${{ vars.RELEASES_URL }}
        run: scripts/package
      - name: Note the sources the cache was built from
        if: github.ref == 'refs/heads/master'
        run: scripts/ci-sources record
      - name: Save build cache
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: release-v2-macos-aarch64-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-macos-aarch64
          path: dist/herdr-app-macos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ci.yml runs when the tagged commit reaches master; wait for its result.
  # A newer push cancels it: rerun it and this job carries on.
  ci-passed:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.id)"') || run="api error"
            echo "ci for $GITHUB_SHA: $run"
            case "$run" in
              "completed success "*) exit 0 ;;
              "completed cancelled "*) echo "cancelled by a newer push: rerun that ci run, this job keeps waiting" ;;
              completed*) exit 1 ;;
            esac
            sleep 30
          done

  # A website download, never a dependency of update publishing below.
  mac-dmg:
    needs: [build, ci-passed]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.ci-passed.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' && github.triggering_actor == github.repository_owner))
    environment: ${{ github.ref_type == 'tag' && 'release' || 'build' }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-macos-aarch64
          path: dist
      - name: Install DMG tools
        run: brew install create-dmg jq awscli
      - name: Build DMG
        run: |
          tar -xzf dist/herdr-app-macos-aarch64.tar.gz -C dist
          scripts/mac-dmg dist/Herdr.app dist/Herdr.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Herdr-dmg
          path: dist/Herdr.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload website download
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          aws s3 cp --endpoint-url "$ENDPOINT" dist/Herdr.dmg "s3://$BUCKET/app/$version/Herdr.dmg" --cache-control "public, max-age=31536000, immutable" --content-type application/x-apple-diskimage
          aws s3 cp --endpoint-url "$ENDPOINT" dist/Herdr.dmg "s3://$BUCKET/app/Herdr.dmg" --cache-control "no-cache" --content-type application/x-apple-diskimage

  publish:
    needs: [build, ci-passed]
    # Only the repository owner can publish a tag. This prevents other users
    # from re-running an old release and pointing latest.json back at it.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.ci-passed.result == 'success'
      && github.event_name == 'push' && github.ref_type == 'tag' && github.triggering_actor == github.repository_owner
    # The R2 keys live here, usable only from v* tags.
    environment: release
    runs-on: macos-15
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET }}
      RELEASES_URL: ${{ vars.RELEASES_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-macos-aarch64
          path: dist
      - name: Install upload tool
        run: brew install awscli
      - name: Manifest
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(tr -d '[:space:]' < distribution/core-version)
          python3 - "$version" "$core" <<'PY'
          import hashlib, json, pathlib, sys, os
          version, core = sys.argv[1], sys.argv[2]
          base = os.environ["RELEASES_URL"]
          targets = {}
          for f in sorted(pathlib.Path("dist").glob("herdr-app-*.tar.gz")):
              t = f.name.removeprefix("herdr-app-").removesuffix(".tar.gz")
              targets[t] = {"url": f"{base}/app/{version}/{f.name}", "sha256": hashlib.sha256(f.read_bytes()).hexdigest()}
          # core_min: the oldest core this app works with.
          doc = {"version": version, "core_min": core, "notes": f"Herdr {version}", "targets": targets}
          pathlib.Path("dist/manifest.json").write_text(json.dumps(doc, indent=2) + "\n")
          print(json.dumps(doc, indent=2))
          PY
      - name: Upload
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          s3() { aws s3 cp --endpoint-url "$ENDPOINT" "$@"; }
          for f in dist/herdr-app-*.tar.gz dist/manifest.json; do
            s3 "$f" "s3://$BUCKET/app/$version/$(basename "$f")" --cache-control "public, max-age=31536000, immutable"
          done
          s3 CHANGELOG.md "s3://$BUCKET/app/$version/changelog.md" --cache-control "public, max-age=31536000, immutable" --content-type text/markdown
          s3 dist/manifest.json "s3://$BUCKET/app/latest.json" --cache-control "no-cache" --content-type application/json
          # 0.1.0/0.1.1 set to the preview channel still ask here.
          s3 dist/manifest.json "s3://$BUCKET/app/preview/latest.json" --cache-control "no-cache" --content-type application/json
          s3 distribution/install.sh "s3://$BUCKET/app/install.sh" --cache-control "no-cache" --content-type text/x-shellscript
